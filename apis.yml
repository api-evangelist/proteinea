aid: proteinea
name: Proteinea
description: >-
  Proteinea is an AI-driven biotechnology company engineering next-generation
  therapeutic antibodies. It integrates protein language models, computational
  biology and biological automation to design, optimize and validate biologics
  faster and more safely. Proteinea is the creator of Ankh, an optimized
  general-purpose protein language model, and operates a Protein Engineering
  Platform (PEP) for multi-parameter optimization and RaGene for AI-driven
  codon/gene optimization, with a focus on rational Fc-domain engineering for
  context-specific immune tuning, enhanced half-life and targeted
  biodistribution. Headquartered in Cairo, Egypt with offices in Cambridge/
  Boston, MA and a presence at KAUST, Saudi Arabia. Backed by 500 Global,
  IndieBio/SOSV, Shorooq Partners, Sawari Ventures and others. The company
  exposes research software (open-source models and benchmarks) rather than a
  public developer API.
